# /etc/nginx/sites-available/jdshop
# api 子域只提供 API；www 子域只提供主管理员控制台。

# 浏览器跨域预检不消耗业务请求额度。管理台一次切换页面会并发多个
# OPTIONS + API 请求，旧的 30r/m 配置会误伤正常操作。
map $request_method $api_limit_key {
    default     $binary_remote_addr;
    OPTIONS     "";
}

limit_req_zone $api_limit_key zone=admin_api_limit:10m rate=300r/m;
limit_req_zone $api_limit_key zone=api_limit:10m rate=120r/m;
limit_req_zone $api_limit_key zone=login_limit:10m rate=5r/m;

server {
    listen 80;
    server_name api.yourdomain.com www.yourdomain.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# API 专用域名：除 /api/* 外全部返回 404。
server {
    listen 443 ssl http2;
    server_name api.yourdomain.com;

    ssl_certificate /etc/nginx/ssl/jdshop/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/jdshop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    limit_req_status 429;

    access_log /var/log/nginx/jdshop-api-access.log;
    error_log /var/log/nginx/jdshop-api-error.log warn;

    gzip on;
    gzip_min_length 256;
    gzip_types application/json text/plain;

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/control/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    location ^~ /api/v1/admin/ {
        limit_req zone=admin_api_limit burst=100 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Nginx 在反向代理前拒绝请求时，Go CORS 中间件不会运行。单独为
    # 429 补齐管理台来源，使浏览器能显示明确提示而不是 Failed to fetch。
    error_page 429 = @api_rate_limited;
    location @api_rate_limited {
        default_type application/json;
        add_header Access-Control-Allow-Origin "https://www.jdshop.bbroot.com" always;
        add_header Vary "Origin" always;
        add_header Retry-After "2" always;
        return 429 '{"code":10006,"message":"请求过于频繁，请稍后再试","data":null}';
    }

    location / {
        return 404;
    }
}

# 管理台专用域名：静态提供 /admin，不在 www 域名代理任何 API。
server {
    listen 443 ssl http2;
    server_name www.yourdomain.com;

    ssl_certificate /etc/nginx/ssl/jdshop/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/jdshop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /var/log/nginx/jdshop-admin-access.log;
    error_log /var/log/nginx/jdshop-admin-error.log warn;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = / {
        return 302 /admin;
    }

    location = /admin/ {
        return 301 /admin;
    }

    location = /admin {
        alias /opt/jdshop/static/admin.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
    }

    location / {
        return 404;
    }
}
