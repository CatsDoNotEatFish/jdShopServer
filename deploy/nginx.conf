# /etc/nginx/sites-available/jdshop
# 首次签发证书前的 HTTP-01 引导配置。

server {
    listen 80;
    server_name api.yourdomain.com www.yourdomain.com;

    access_log /var/log/nginx/jdshop-bootstrap-access.log;
    error_log /var/log/nginx/jdshop-bootstrap-error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type text/plain;
    }

    # 证书签发前不公开 API 测试台、管理台或明文登录入口。
    location / {
        return 404;
    }
}
