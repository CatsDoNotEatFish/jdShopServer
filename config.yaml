server:
  port: 8080
  host: "127.0.0.1"
  read_timeout: 10
  write_timeout: 10

database:
  path: "data/app.db"
  max_open_conns: 1
  wal_mode: true

auth:
  super_admin_username: "admin"
  bcrypt_cost: 10
  access_token_ttl: 7200
  refresh_token_ttl: 2592000
  login_max_attempts: 5
  login_lock_minutes: 15
  require_encrypted_requests: true

sms:
  enabled: true
  endpoint: "https://api.smsbao.com/sms"
  username: "ranbaobao"
  api_key: ""
  goods_id: ""
  content_template: "【染宝科技】您的验证码为%s，在5分钟内有效"

log:
  level: "info"
  file: ""

cors:
  allowed_origins:
    - "http://localhost:8788"
    - "http://127.0.0.1:8788"
    - "https://www.jdshop.bbroot.com"
